name: Release

# Publie une release quand un tag de version est poussé :
#   git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier que les CSS générés sont à jour
        run: |
          python3 tools/build.py
          git diff --exit-code -- chrome/ || {
            echo "::error::chrome/strata/*.css n'est pas à jour : lancez python3 tools/build.py et commitez."
            exit 1
          }

      - name: Créer l'archive
        run: tools/package.sh "$GITHUB_REF_NAME"

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/StrataFox-$GITHUB_REF_NAME.zip" \
            --title "Strata $GITHUB_REF_NAME" \
            --generate-notes
